<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) resolve to real
         values; without it they are 0 and the floating nav sits on the home
         indicator instead of above it.
         Note there is no maximum-scale / user-scalable=no here. The old build
         had both: iOS ignores them and Android treats them as an accessibility
         regression. See LOCK_PINCH_ZOOM in main.jsx. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>STACK — Daily Protocol</title>
    <meta name="description" content="Daily skincare, supplement and training protocol tracker." />

    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />

    <!-- STACK IS NOT AN INSTALLABLE PWA ANY MORE. The manifest link and the
         apple-mobile-web-app-* tags were removed: it is used as a page on
         Vercel, so there is no home-screen container to configure and those
         tags only ever applied to one.

         theme-color STAYS — it colours the browser's own UI (Android Chrome's
         address bar), which is a plain-tab feature, not an install feature.
         Keep it in sync with --bg in src/theme.css.

         The service worker also stays, and NOT for offline: notifications fire
         through its registration, because `new Notification()` is unsupported
         on Android Chrome. See public/sw.js. -->
    <meta name="theme-color" content="#131011" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Sora:wght@600;700;800&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
